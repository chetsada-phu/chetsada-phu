name: Generate contribution snake

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github&color_snake=#5140be&color_dots=#ebedf0,#d8d0ef,#a99bdf,#7d6cd0,#5140be
            dist/snake-dark.svg?palette=github-dark&color_snake=#c9c0f0&color_dots=#161b22,#2e2a57,#463d8f,#6b5cc6,#a99bdf

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
