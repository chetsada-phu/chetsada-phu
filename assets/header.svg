<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Chetsada Phummee</title>
  <desc id="desc">Economics student working across Data Science, Machine Learning Engineering and Applied AI. A small forecast chart draws itself on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7fc"/>
      <stop offset="1" stop-color="#eeebfa"/>
    </linearGradient>
    <clipPath id="clip-0"><rect x="76" y="150" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.267;0.317;1" values="0;188;188;0;0"/>
    </rect></clipPath>
    <clipPath id="clip-1"><rect x="76" y="150" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.333;0.483;0.6;0.65;1" values="0;0;437;437;0;0"/>
    </rect></clipPath>
    <clipPath id="clip-2"><rect x="76" y="150" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.667;0.767;0.933;0.983;1" values="0;0;156;156;0;0"/>
    </rect></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="22" fill="url(#bg)" stroke="#dedbe9" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="58" fill="#5140be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">ECONOMICS × DATA SCIENCE × APPLIED AI</text>
    <text x="46" y="112" fill="#242236" font-size="46" font-weight="700" letter-spacing="-1.5">Chetsada Phummee<tspan fill="#5140be">.</tspan></text>
    <text x="48" y="140" fill="#686479" font-size="17">You can call me Jayda.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">
    <text x="48" y="180" fill="#a99bdf">$</text>
    <text x="76" y="180" fill="#5140be" clip-path="url(#clip-0)">Data Science</text>
    <text x="76" y="180" fill="#5140be" clip-path="url(#clip-1)">Machine Learning Engineering</text>
    <text x="76" y="180" fill="#5140be" clip-path="url(#clip-2)">Applied AI</text>
    <rect y="158" width="3" height="28" fill="#5140be" x="76">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.267;0.317;0.333;0.483;0.6;0.65;0.667;0.767;0.933;0.983;1" values="76;264;264;76;76;513;513;76;76;232;232;76;76"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;1" values="1;0;1" calcMode="discrete"/>
    </rect>
  </g>

  <g stroke="#dedbe9" stroke-dasharray="3 6">
    <line x1="630" y1="60" x2="970" y2="60"/>
    <line x1="630" y1="100" x2="970" y2="100"/>
    <line x1="630" y1="140" x2="970" y2="140"/>
    <line x1="630" y1="180" x2="970" y2="180"/>
  </g>
  <line x1="890" y1="44" x2="890" y2="196" stroke="#c9c0f0" stroke-width="1.5"/>

  <polygon points="890,90 915,62 940,62 960,44 960,86 940,98 915,88" fill="#a99bdf" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.33;0.9;1" values="0;0;0.3;0.3;0"/>
  </polygon>
  <path d="M640,170 L665,150 L690,160 L715,128 L740,138 L765,110 L790,122 L815,96 L840,104 L865,82 L890,90" fill="none" stroke="#5140be" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.9;1" values="1;0;0;1"/>
  </path>
  <path d="M890,90 L915,74 L940,80 L960,64" fill="none" stroke="#7d6cd0" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.33;0.9;1" values="0;0;1;1;0"/>
  </path>
  <circle cx="890" cy="90" r="5" fill="#5140be" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.9;1" values="0;0;1;1;0"/>
  </circle>
  <circle cx="890" cy="90" r="5" fill="none" stroke="#5140be" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="2s" repeatCount="indefinite" values="5;16"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.26;0.9;1" values="0;0;0.6;0.6;0"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#686479">
    <text x="640" y="214">history</text>
    <text x="898" y="214">forecast</text>
    <text x="640" y="234" fill="#5140be">question → evidence → decision</text>
  </g>
</svg>
